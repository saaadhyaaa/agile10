apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-v1
  template:
    metadata:
      labels:
        app: flask-v1
    spec:
      containers:
        - name: flask-v1

          image: saadhyaprabu/flask-lab-app:v1

          ports:
            - containerPort: 5000